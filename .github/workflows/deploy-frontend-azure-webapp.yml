name: Deploy Frontend to Azure Web App

on:
  push:
    branches:
      - master
    paths:
      - frontend/**
      - .github/workflows/deploy-frontend-azure-webapp.yml
  workflow_dispatch:

concurrency:
  group: deploy-frontend-azure-webapp
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://auditoriasalud-btdnf6gjgkfndsa9.centralus-01.azurewebsites.net

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Azure credentials
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' && secrets.AZURE_CREDENTIALS == '' }}
        run: |
          echo "Missing deployment credentials."
          echo "Set one of these repository secrets:"
          echo "- AZURE_WEBAPP_PUBLISH_PROFILE (recommended)"
          echo "- AZURE_CREDENTIALS (JSON from Azure service principal)"
          exit 1

      - name: Azure Login (fallback)
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' && secrets.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy with Publish Profile
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: auditoriasalud-btdnf6gjgkfndsa9
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: frontend/dist

      - name: Deploy with Azure Login
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' && secrets.AZURE_CREDENTIALS != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: auditoriasalud-btdnf6gjgkfndsa9
          package: frontend/dist